# The plugin is installed straight from this repository through
# `claude plugin marketplace add 3DAPI-Inc/dapilot`, so a push is a release.
# This checks what a user's install would read: both manifests validate under
# --strict. The version itself moves on main, by release.yml, the moment a
# change to the plugin lands there (since 2026-10-27); a pull request no longer
# has to carry the bump, and one that does is simply a release from that point.
name: plugin

on:
  push:
    paths: [plugins/dapilot/**, .claude-plugin/**, .github/workflows/plugin.yml]
  pull_request:
    paths: [plugins/dapilot/**, .claude-plugin/**, .github/workflows/plugin.yml]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate the plugin manifest
        run: claude plugin validate --strict plugins/dapilot
      - name: Validate the marketplace manifest
        run: claude plugin validate --strict .
